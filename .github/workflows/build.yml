name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  build:
    name: release (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          out="crisp-rs-${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/crisp-rs${{ matrix.ext }}"  "dist/$out/"
          cp "target/${{ matrix.target }}/release/crisp-gui${{ matrix.ext }}" "dist/$out/"
          cp README.md "dist/$out/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-rs-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
