name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build macOS (arm64). Needs macOS runners to be available for this repo."
        type: boolean
        default: false
      release_tag:
        description: "If set (e.g. v0.1.0), publish the build as a GitHub Release with this tag."
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  build:
    name: release (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          out="crisp-rs-${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp "target/${{ matrix.target }}/release/crisp-rs${{ matrix.ext }}"  "dist/$out/"
          cp "target/${{ matrix.target }}/release/crisp-gui${{ matrix.ext }}" "dist/$out/"
          cp README.md "dist/$out/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-rs-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # macOS runners were not available for this repository (the job sat in the
  # queue until cancelled), so macOS is opt-in via "Run workflow" and never
  # blocks the Linux/Windows release.
  build-macos:
    name: release (macos-arm64)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: package
        run: |
          set -euo pipefail
          out="crisp-rs-macos-arm64"
          mkdir -p "dist/$out"
          cp target/release/crisp-rs target/release/crisp-gui README.md "dist/$out/"
          cd dist && tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-rs-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Tag push: use that tag. Manual run: create `release_tag` on this commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: crisp-rs ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
